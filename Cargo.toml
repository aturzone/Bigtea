[workspace]
resolver = "2"
members = [
    "crates/chaos-gguf",
    "crates/chaos-probe",
    "crates/chaos-plan",
    "crates/chaos-io",
    "crates/chaos-model",
    "crates/chaos-ggml",
    "crates/chaos-tokenizer",
    "crates/chaos-grammar",
    "crates/chaos-jinja",
    "crates/chaos-arch",
    "crates/chaos-app",
    "crates/chaos-setup",
]

[workspace.package]
version = "0.0.4"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/aturzone/Chaos"
homepage = "https://github.com/aturzone/Chaos"
authors = ["Atur Dana <https://github.com/aturzone>"]
keywords = ["llm", "inference", "moe", "gguf", "streaming"]
categories = ["science", "command-line-utilities"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
