[workspace]
resolver = "2"
members = [
    "crates/bigtea-gguf",
    "crates/bigtea-probe",
    "crates/bigtea-plan",
    "crates/bigtea-io",
    "crates/bigtea-model",
    "crates/bigtea-ggml",
    "crates/bigtea-tokenizer",
    "crates/bigtea-grammar",
    "crates/bigtea-jinja",
    "crates/bigtea-arch",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/aturzone/Bigtea"
homepage = "https://github.com/aturzone/Bigtea"
authors = ["Atur Dana <https://github.com/aturzone>"]
keywords = ["llm", "inference", "moe", "gguf", "streaming"]
categories = ["science", "command-line-utilities"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
