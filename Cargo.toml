[workspace]
resolver = "2"
members = [
    "crates/bigtea-gguf",
    "crates/bigtea-probe",
    "crates/bigtea-plan",
    "crates/bigtea-io",
    "crates/bigtea-model",
    "crates/bigtea-ggml",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "Apache-2.0"
repository = "https://github.com/aturzone/Bigtea"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
