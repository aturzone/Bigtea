[package]
name = "chaos-io"
description = "Cache-bypassing aligned reads for streaming weights from disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[[bin]]
name = "chaos-iobench"
path = "src/bin/chaos-iobench.rs"
test = false

[build-dependencies]
# The icon every shipped .exe carries, in one place rather than a copy
# per crate. Not linked into anything: it runs on the build machine.
chaos-build = { path = "../../core/build" }
