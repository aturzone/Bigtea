[package]
name = "chaos-probe"
description = "Measure what this machine can actually do: RAM, storage capacity and real read bandwidth, GPUs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies. The platform calls needed here are a handful of FFI
# declarations; a crate for them would be more supply chain than code.
[dependencies]

# Binary targets contain no #[test] functions, so the empty harness cargo would
# build for each is pure overhead -- and on Windows with Smart App Control
# enforced, running those unsigned harnesses is blocked outright, failing the
# suite for no reason. The library tests are unaffected.

[[bin]]
name = "chaos-probe"
path = "src/bin/chaos-probe.rs"
test = false

[build-dependencies]
# The icon every shipped .exe carries, in one place rather than a copy
# per crate. Not linked into anything: it runs on the build machine.
chaos-build = { path = "../../core/build" }
