[package]
name = "chaos-arch"
description = "Model architectures: turning weights and tokens into logits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
chaos-gguf = { path = "../chaos-gguf" }
chaos-ggml = { path = "../chaos-ggml" }
chaos-io = { path = "../chaos-io" }
chaos-model = { path = "../chaos-model" }
chaos-probe = { path = "../chaos-probe" }
chaos-grammar = { path = "../chaos-grammar" }
chaos-jinja = { path = "../chaos-jinja" }
chaos-tokenizer = { path = "../chaos-tokenizer" }

[[bin]]
name = "chaos-serve"
path = "src/bin/chaos-serve.rs"
# Unlike the other binaries this one has real unit tests -- request parsing and
# JSON escaping, where a mistake corrupts a response rather than failing -- so
# its harness is not empty and must run.
test = true

[[bin]]
name = "chaos-run"
path = "src/bin/chaos-run.rs"
test = false

[[bin]]
name = "chaos-spectrum"
path = "src/bin/chaos-spectrum.rs"
test = false

[[bin]]
name = "chaos-gpubench"
path = "src/bin/chaos-gpubench.rs"
# `test = false` like its neighbours: an empty harness is pointless, and Smart
# App Control blocks unsigned fresh binaries on Windows.
test = false

[[bin]]
name = "chaos-kernelbench"
path = "src/bin/chaos-kernelbench.rs"
test = false

[build-dependencies]
# The icon every shipped .exe carries, in one place rather than a copy
# per crate. Not linked into anything: it runs on the build machine.
chaos-build = { path = "../chaos-build" }
