[package]
name = "bigtea-arch"
description = "Model architectures: turning weights and tokens into logits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
bigtea-gguf = { path = "../bigtea-gguf" }
bigtea-ggml = { path = "../bigtea-ggml" }
bigtea-io = { path = "../bigtea-io" }
bigtea-model = { path = "../bigtea-model" }
bigtea-probe = { path = "../bigtea-probe" }
bigtea-grammar = { path = "../bigtea-grammar" }
bigtea-jinja = { path = "../bigtea-jinja" }
bigtea-tokenizer = { path = "../bigtea-tokenizer" }

[[bin]]
name = "bigtea-serve"
path = "src/bin/bigtea-serve.rs"
# Unlike the other binaries this one has real unit tests -- request parsing and
# JSON escaping, where a mistake corrupts a response rather than failing -- so
# its harness is not empty and must run.
test = true

[[bin]]
name = "bigtea-run"
path = "src/bin/bigtea-run.rs"
test = false

[[bin]]
name = "bigtea-spectrum"
path = "src/bin/bigtea-spectrum.rs"
test = false

[[bin]]
name = "bigtea-gpubench"
path = "src/bin/bigtea-gpubench.rs"
# `test = false` like its neighbours: an empty harness is pointless, and Smart
# App Control blocks unsigned fresh binaries on Windows.
test = false

[[bin]]
name = "bigtea-kernelbench"
path = "src/bin/bigtea-kernelbench.rs"
test = false
