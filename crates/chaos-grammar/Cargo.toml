[package]
name = "chaos-grammar"
description = "GBNF grammars and JSON-schema constraints, compiled to a per-token mask."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependencies at all -- not even on the tokenizer.
#
# The vocabulary arrives as bytes the caller already has, so this crate never
# needs to know what a GGUF is, and it holds no reference to ggml. That is what
# lets it build in the CI job that proves the ggml-free crates are usable on a
# machine which has never compiled a line of C.
[dependencies]
