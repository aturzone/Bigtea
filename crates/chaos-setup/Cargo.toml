# The Windows installer.
#
# One .exe that carries every Chaos binary inside it and installs the lot:
# no download, no unzip, no PowerShell, no toolchain. Double-click, choose a
# folder, done.
#
# **Built without NSIS, WiX, Inno or MSI tooling**, because none of those are
# dependencies this project is willing to take and all of them would have to be
# installed on the build machine before a release could be cut. A Windows
# installer is a window, a file copy, two registry keys and a shortcut, and all
# four are in `user32`, `kernel32`, `advapi32` and `ole32`.
#
# The payload is embedded at build time by `build.rs` from a staging directory.
# With no staging directory it builds an installer that carries nothing and says
# so, rather than failing the workspace build for everyone who is not cutting a
# release.
[package]
name = "chaos-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Installer for Chaos on Windows."

[dependencies]
chaos-app = { path = "../chaos-app" }

[[bin]]
name = "chaos-setup"
path = "src/main.rs"
test = false

[lib]
name = "chaos_setup"
path = "src/lib.rs"
