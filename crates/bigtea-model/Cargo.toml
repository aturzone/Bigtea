[package]
name = "bigtea-model"
description = "A model on disk: sharded GGUF containers, resolved into readable tensors."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bigtea-gguf = { path = "../bigtea-gguf" }
bigtea-io = { path = "../bigtea-io" }
bigtea-plan = { path = "../bigtea-plan" }
bigtea-probe = { path = "../bigtea-probe" }

# Binary targets contain no #[test] functions, so the empty harness cargo would
# build for each is pure overhead -- and on Windows with Smart App Control
# enforced, running those unsigned harnesses is blocked outright, failing the
# suite for no reason. The library tests are unaffected.

[[bin]]
name = "bigtea-pull"
path = "src/bin/bigtea-pull.rs"
test = false

[[bin]]
name = "bigtea-model-info"
path = "src/bin/bigtea-model-info.rs"
test = false

[[bin]]
name = "bigtea-loadbench"
path = "src/bin/bigtea-loadbench.rs"
test = false

[[bin]]
name = "bigtea-meta"
path = "src/bin/bigtea-meta.rs"
test = false
