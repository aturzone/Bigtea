name: Release

# Build redistributable binaries on a tag and attach them to the GitHub Release.
#
# Today the only way to try Chaos is to install the GNU Rust toolchain, install
# MSYS2, build ggml by hand and set an environment variable. That is a wall in
# front of every potential user, and it is the largest single thing standing
# between the project and anyone actually running it.
#
# **Redistributable is the hard part, not building.** A binary that starts on the
# machine that compiled it is easy; one that starts on a machine with no
# toolchain is the point. Windows died with `0xC0000135` before `main` on any
# machine without MSYS2 — silently, with no message — until the GNU C++ and
# OpenMP runtimes were linked statically. So every artefact here is checked for
# the thing that would make it useless: that it runs at all.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (for a dry run without publishing)'
        required: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux-x86_64,   ext: '',     archive: tar.gz }
          - { os: macos-latest,   name: macos-arm64,    ext: '',     archive: tar.gz }
          - { os: windows-latest, name: windows-x86_64, ext: '.exe', archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Use the GNU toolchain on Windows
        if: runner.os == 'Windows'
        run: rustup default stable-x86_64-pc-windows-gnu

      - name: MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Put mingw64 on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "D:/a/_temp/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build ggml (Windows, MinGW)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a" || { echo "::error::ggml-libs/$lib.a missing"; exit 1; }
          done

      - name: Build ggml (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --config Release --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a" || { echo "::error::ggml-libs/$lib.a missing"; exit 1; }
          done

      - name: Build release binaries
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: cargo build --release --workspace --bins

      # The whole point of shipping a binary is that it runs somewhere the
      # toolchain does not. `--help`-style smoke tests catch the failure mode
      # that matters — a missing runtime DLL kills the process before `main`,
      # so there is no error message to read, only an exit code.
      - name: The binaries actually start
        shell: bash
        run: |
          cd target/release
          fail=0
          for b in chaos-run chaos-serve chaos-probe chaos-model-info chaos-pull chaos-meta gguf-info chaos-loadbench chaos-iobench chaos-gpubench; do
            exe="./$b${{ matrix.ext }}"
            test -f "$exe" || { echo "::error::$b was not built"; fail=1; continue; }
            # No arguments: every one of these prints usage and exits non-zero,
            # which is fine. A load-time failure exits without printing at all.
            # The benchmarks with no flags would start measuring -- disk,
            # then the GPU -- so give them the cheap path; everything else
            # prints usage and exits.
            case "$b" in
              chaos-probe|chaos-iobench|chaos-gpubench) args=(--help) ;;
              *) args=() ;;
            esac
            out=$("$exe" "${args[@]}" 2>&1 || true)
            if [ -z "$out" ]; then
              echo "::error::$b produced no output — it probably failed before main (missing runtime?)"
              fail=1
            else
              echo "$b starts: $(echo "$out" | head -1)"
            fi
          done
          exit $fail

      - name: Report what the binaries link against
        shell: bash
        run: |
          cd target/release
          echo "### Dynamic dependencies of \`chaos-run\` (${{ matrix.name }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ "${{ runner.os }}" = "Linux" ]; then ldd chaos-run >> $GITHUB_STEP_SUMMARY || true
          elif [ "${{ runner.os }}" = "macOS" ]; then otool -L chaos-run >> $GITHUB_STEP_SUMMARY || true
          else objdump -p chaos-run.exe | grep 'DLL Name' >> $GITHUB_STEP_SUMMARY || true
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      # The installer is built LAST and separately, because it embeds the other
      # binaries: `build.rs` reads CHAOS_STAGE_DIR and links every file in that
      # directory into the .exe. Building it in the same pass as its own payload
      # would embed whatever the previous run happened to leave behind.
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: |
          mkdir -p stage
          for b in chaos-app chaos-run chaos-serve chaos-probe chaos-model-info chaos-pull chaos-meta gguf-info chaos-loadbench chaos-iobench chaos-gpubench; do
            test -f "target/release/$b.exe" || { echo "::error::$b.exe missing"; exit 1; }
            cp "target/release/$b.exe" stage/
          done
          cp README.md LICENSE NOTICE CHANGELOG.md STATUS.md stage/
          CHAOS_STAGE_DIR="$(pwd)/stage" cargo build --release -p chaos-setup
          test -f target/release/chaos-setup.exe || { echo "::error::chaos-setup.exe was not built"; exit 1; }
          # An installer much smaller than its payload embedded nothing, which
          # still builds, still runs, and installs zero files. Check the size
          # rather than trusting that build.rs found the directory.
          payload=$(du -bs stage | cut -f1)
          setup=$(stat -c%s target/release/chaos-setup.exe)
          echo "payload ${payload} bytes, installer ${setup} bytes"
          if [ "$setup" -lt $((payload / 2)) ]; then
            echo "::error::chaos-setup.exe is $setup bytes against a $payload byte payload -- it embedded nothing"
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME:-dev}"
          # **One prefix, one version format, platform and architecture
          # always present.** The v0.0.8 assets were a mix of `chaos-` and
          # `Chaos-`, and a release page where the same project spells its own
          # name two ways looks unfinished. `Chaos` is the product name, so that
          # is the one that survives. The .deb keeps its own scheme below,
          # because Debian policy requires `name_version_arch.deb` in lower case
          # with no `v`, and an installer that will not install is not tidier.
          DIR="Chaos-${VER}-${{ matrix.name }}"
          mkdir -p "$DIR"
          # chaos-app ships but is deliberately absent from the smoke test
          # above: with no arguments it opens a window, and CI would wait
          # for someone to close it.
          for b in chaos-app chaos-run chaos-serve chaos-probe chaos-model-info chaos-pull chaos-meta gguf-info chaos-loadbench chaos-iobench chaos-gpubench; do
            cp "target/release/$b${{ matrix.ext }}" "$DIR/"
          done
          cp README.md LICENSE NOTICE CHANGELOG.md STATUS.md "$DIR/"
          # The Windows archive carries its own installer. Unix gets three
          # lines of `install -m 755` in the README instead, which is what
          # anyone on those platforms would rather have than a script.
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp scripts/install.ps1 "$DIR/"
            # The double-click path: starts the server and opens the browser.
            cp "scripts/Chat with Chaos.cmd" "$DIR/"
            cp target/release/chaos-setup.exe "$DIR/"
            # And beside the archive, under a name that says what it is: someone
            # who wants an installer should not have to find and unpack a zip to
            # reach it. One file, download and run.
            cp target/release/chaos-setup.exe "Chaos-${VER}-windows-x86_64-Setup.exe"
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$DIR.zip" "$DIR" >/dev/null
          else
            tar czf "$DIR.tar.gz" "$DIR"
          fi
          ls -la Chaos-*.${{ matrix.archive }}

      # A tarball asks the user to decide where binaries go and to edit their
      # PATH; neither answer is obvious to somebody who just wants to run a
      # model. Linux gets the two formats it actually installs from.
      - name: Linux packages (.deb, AppImage)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools
          VER="${GITHUB_REF_NAME:-dev}"
          bash scripts/make-linux-packages.sh "$VER" "target/release"
          ls -la *.deb *.AppImage 2>/dev/null || true

      # Both formats are checked here, not assumed. A .deb that dpkg cannot
      # read and an AppImage that will not execute are exactly the failures
      # nobody notices until a user reports them.
      - name: Verify the Linux packages
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: |
          deb=$(ls chaos_*_amd64.deb)
          dpkg-deb --info "$deb"
          # **Not a pipe into `grep -q`.** Actions runs steps with
          # `set -eo pipefail`, and `grep -q` exits the moment it matches, so
          # `dpkg-deb` takes SIGPIPE and the pipeline reports failure *because
          # the check succeeded*. That is what failed the first v0.0.7 build.
          dpkg-deb --contents "$deb" > deb-contents.txt
          grep -q 'usr/lib/chaos/chaos-run' deb-contents.txt             || { echo "::error::the .deb has no chaos-run"; sed -n '1,40p' deb-contents.txt; exit 1; }
          # Install it for real and run the result off PATH.
          sudo dpkg -i "$deb"
          command -v chaos-run >/dev/null || { echo "::error::chaos-run is not on PATH after install"; exit 1; }
          chaos-run --version || chaos-probe --quick >/dev/null || true
          sudo dpkg -r chaos
          # Same hazard: `ls` of a missing glob is non-zero, and under
          # `pipefail` that fails the step rather than skipping the check.
          img=""
          for f in Chaos-*-linux-x86_64.AppImage; do [ -e "$f" ] && img="$f" && break; done
          if [ -n "$img" ]; then
            # --appimage-extract avoids needing FUSE on the runner.
            ./"$img" --appimage-extract >/dev/null
            ./squashfs-root/AppRun chaos-probe --quick >/dev/null               || { echo "::error::the AppImage cannot run chaos-probe"; exit 1; }
            rm -rf squashfs-root
            echo "AppImage runs"
          fi

      # An installer that fails on the archive it ships with is worse than no
      # installer, and it is the one thing here that cannot be checked locally
      # in the shape a user meets it: unpacked archive, no toolchain, no repo.
      # The setup .exe is what most people will download, and the one artefact
      # that cannot be verified by building it. Silent mode exists so this can
      # run at all: a windows-subsystem binary has no console, and CI has nobody
      # to press a button.
      # The setup .exe is what most people will download, and the one artefact
      # that cannot be verified by building it. Silent mode exists so this can
      # run at all: a windows-subsystem binary has no console, and CI has nobody
      # to press a button.
      #
      # **`& $setup /S` does NOT wait.** A window-subsystem executable detaches
      # from the shell that started it, so control returns immediately,
      # `$LASTEXITCODE` is empty, and `$LASTEXITCODE -ne 0` is TRUE because
      # `$null -ne 0`. The first version of this step failed the release that
      # way while the installer itself was fine -- it had simply not been given
      # time to start. Every scripted call needs `Start-Process -Wait`, which is
      # how NSIS and every other GUI installer behaves too.
      # D4. `chaos-app` cannot be in the "binaries actually start" check --
      # with no arguments it opens a window and CI would wait forever. But an
      # app that only builds is what shipped a version that aborted on the
      # first click, so it is started, given a moment, and required to still
      # be alive. That is the smallest check that would have caught it.
      - name: The app starts and stays up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Join-Path $PWD 'target/release/chaos-app.exe'
          $log = Join-Path $env:TEMP 'chaos-app-crash.log'
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            throw "chaos-app exited on its own with code $($p.ExitCode)"
          }
          $p | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (Test-Path $log) {
            Get-Content $log
            throw "chaos-app wrote a crash log"
          }
          # Closing the app must not leave the engine running (C4).
          $left = @(Get-Process chaos-serve -ErrorAction SilentlyContinue).Count
          if ($left -ne 0) { throw "$left chaos-serve process(es) left running after the app closed" }
          Write-Host 'chaos-app started, stayed up, closed clean'

      - name: The setup .exe installs, runs and uninstalls (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Join-Path $PWD 'target/release/chaos-setup.exe'
          $prefix = Join-Path $env:RUNNER_TEMP 'chaos-setup-test'
          $p = Start-Process -FilePath $setup -ArgumentList '/S', '--prefix', $prefix -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content (Join-Path $prefix 'setup.log') -ErrorAction SilentlyContinue
            throw "chaos-setup /S exited $($p.ExitCode)"
          }
          $exe = Join-Path $prefix 'bin/chaos-run.exe'
          if (-not (Test-Path $exe)) { throw "chaos-run.exe missing after install" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed chaos-run does not start" }
          if (-not (Test-Path (Join-Path $prefix 'bin/chaos-app.exe'))) { throw "chaos-app.exe missing after install" }
          # Models live outside the prefix on purpose, and uninstall must not
          # reach them. A wrong answer here deletes someone's 155 GB download.
          $models = Join-Path $env:USERPROFILE '.chaos/models'
          if (-not (Test-Path $models)) { throw "the models directory was not created" }
          $u = Start-Process -FilePath $setup -ArgumentList '/S', '--uninstall', '--prefix', $prefix -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "uninstall exited $($u.ExitCode)" }
          if (Test-Path (Join-Path $prefix 'bin')) { throw "uninstall left bin behind" }
          # **The whole prefix, not just bin.** `version.txt` was written by the
          # install and not removed by the uninstall, so the folder survived and
          # a stale version file claimed Chaos was installed when nothing was.
          # Found on a real machine, which is where this assertion comes from.
          if (Test-Path $prefix) {
            Get-ChildItem -Recurse $prefix | Select-Object -First 20 FullName
            throw "uninstall left the prefix behind"
          }
          if (-not (Test-Path $models)) { throw "UNINSTALL DELETED THE MODELS DIRECTORY" }
          Write-Host 'setup: install / run / uninstall clean, models untouched'

          # **Uninstalling from INSIDE the folder being deleted**, which is what
          # Add/Remove Programs does and what was actually broken: a running
          # executable keeps its own file open, so the installer stages a copy in
          # %TEMP% and lets that do the work. The parent used to show a dialog
          # and only exit once dismissed, while the helper gave up after ten
          # seconds -- so the uninstall "finished" with every binary on disk.
          #
          # The helper waits for its parent and outlives this process, so the
          # check has to be a poll rather than an exit code.
          $p2 = Start-Process -FilePath $setup -ArgumentList '/S', '--prefix', $prefix -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "second install exited $($p2.ExitCode)" }
          $inside = Join-Path $prefix 'bin/chaos-setup.exe'
          if (-not (Test-Path $inside)) { throw "the installer did not copy itself into bin" }
          Start-Process -FilePath $inside -ArgumentList '/S', '--uninstall', '--prefix', $prefix
          $gone = $false
          foreach ($i in 1..60) {
            if (-not (Test-Path $prefix)) { $gone = $true; break }
            Start-Sleep -Seconds 1
          }
          if (-not $gone) {
            Get-Content (Join-Path $env:TEMP 'chaos-uninstall.log') -ErrorAction SilentlyContinue
            Get-ChildItem -Recurse $prefix | Select-Object -First 20 FullName
            throw "uninstalling from inside the prefix left it behind"
          }
          if (-not (Test-Path $models)) { throw "UNINSTALL DELETED THE MODELS DIRECTORY" }
          Write-Host 'setup: uninstall from inside the prefix is clean too'

      - name: The installer installs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # `Chaos-*`, matching the archive name. This line looked for
          # `chaos-*` and would have found nothing the moment the prefix changed
          # -- an indexing error on an empty array, in the step that proves the
          # installer works.
          $dir = (Get-ChildItem -Directory -Filter 'Chaos-*-windows-x86_64')[0].FullName
          $prefix = Join-Path $env:RUNNER_TEMP 'chaos-install-test'
          $models = Join-Path $env:RUNNER_TEMP 'chaos-models-test'
          # -NoPath: a CI runner's user PATH is not ours to edit, and the
          # copy/upgrade/manifest half is what an archive can get wrong.
          & powershell -ExecutionPolicy Bypass -File "$dir\install.ps1" -Prefix $prefix -ModelsDir $models -NoPath
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $exe = Join-Path $prefix 'bin\chaos-run.exe'
          if (-not (Test-Path $exe)) { throw "chaos-run.exe is missing: $exe" }
          if (-not (Test-Path $models)) { throw "models directory was not created" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "the installed chaos-run does not start" }
          # Re-running must upgrade in place rather than fail or duplicate.
          & powershell -ExecutionPolicy Bypass -File "$dir\install.ps1" -Prefix $prefix -ModelsDir $models -NoPath
          if ($LASTEXITCODE -ne 0) { throw "re-running install.ps1 exited $LASTEXITCODE" }
          & powershell -ExecutionPolicy Bypass -File "$dir\install.ps1" -Prefix $prefix -ModelsDir $models -NoPath -Uninstall
          if (Test-Path (Join-Path $prefix 'bin')) { throw "uninstall left the bin directory behind" }
          if (-not (Test-Path $models)) { throw "uninstall deleted the models directory" }
          Write-Host 'install / upgrade / uninstall all clean'

      - uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.name }}
          path: |
            Chaos-*.${{ matrix.archive }}
            Chaos-*-Setup.exe
            chaos_*_amd64.deb
            Chaos-*-linux-x86_64.AppImage
          if-no-files-found: error

  publish:
    name: attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job builds nothing, so a checkout looks like waste -- but `gh`
      # infers the repository from the git remote, and `--notes-from-tag` is
      # refused outright when `--repo` is passed instead ("using
      # `--notes-from-tag` with `--repo` is not supported"). `fetch-depth: 0`
      # brings the tags, which is where the notes come from.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      # **A tag push creates a tag, not a release.** `gh release upload` alone
      # exits 1 with `release not found`, which is what happened the first time
      # this workflow ever ran against a real tag: all three archives built and
      # were then thrown away at the last step. Create it if it is missing, and
      # keep the upload separate so a re-run over an existing release still
      # replaces the artefacts rather than failing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # --verify-tag refuses to invent a tag that does not exist, and
            # --notes-from-tag uses the annotated tag's own message rather than
            # generating a commit list nobody wrote.
            gh release create "$TAG" --title "$TAG" --notes-from-tag --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "### Published \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          gh release view "$TAG" --json assets \
            -q '.assets[] | "- \(.name)  \(.size) bytes"' >> $GITHUB_STEP_SUMMARY
