name: CI

# Chaos links against a prebuilt ggml. Rather than vendor it, each job builds
# ggml from llama.cpp and points GGML_LIB_DIR at the result — the same steps a
# contributor follows by hand, so a green CI means the documented steps work.
#
# Linux and macOS have never been executed at runtime. These jobs are the first
# thing that will tell us whether the per-platform direct-I/O paths compile and
# whether the unit tests pass there.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback that needs no C toolchain at all.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  # Seven of the eight crates must keep building without ggml, and the eighth
  # must fail with instructions rather than a wall of unresolved imports. Both
  # halves are promises the README makes, so both are tested.
  without-ggml:
    name: usable without ggml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2

      - name: The ggml-free crates build, test and lint
        run: |
          # Every crate except chaos-arch. The README claims nine of the ten are
          # usable on a machine that has never compiled a line of C, and this is
          # the only thing that makes that a fact rather than a hope --
          # chaos-jinja was missing from the list while the claim counted it.
          CRATES="-p chaos-gguf -p chaos-probe -p chaos-plan -p chaos-io -p chaos-model -p chaos-tokenizer -p chaos-grammar -p chaos-jinja -p chaos-ggml"
          cargo build $CRATES
          cargo test $CRATES
          cargo clippy $CRATES --all-targets -- -D warnings

      - name: chaos-arch fails with instructions, not with import errors
        run: |
          if cargo build -p chaos-arch 2>build.log; then
            echo "::error::chaos-arch built without ggml; the guard in its build.rs is not working"
            exit 1
          fi
          grep -q "GGML_LIB_DIR is not set" build.log \
            || { echo "::error::missing the actionable message"; cat build.log; exit 1; }
          grep -q "github.com/ggml-org/llama.cpp" build.log \
            || { echo "::error::error message does not tell the user what to do"; exit 1; }
          echo "chaos-arch failed correctly, with instructions."

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  name: linux }
          - { os: macos-latest,   name: macos }
          - { os: windows-latest, name: windows }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }

      - name: Use the GNU toolchain on Windows
        # ggml's static archives are produced by MSYS2's gcc and pull in libgomp,
        # which the MSVC linker cannot resolve.
        if: runner.os == 'Windows'
        # `rust-toolchain` installed clippy for the MSVC toolchain; switching
        # default does not bring components across, so add them here or the
        # lint step fails with "cargo-clippy.exe is not installed".
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add clippy --toolchain stable-x86_64-pc-windows-gnu

      # ggml must be built by the *same* toolchain that links it. The Visual
      # Studio generator emits COFF `.lib` archives, which the GNU linker Chaos
      # uses on Windows cannot consume, so MSYS2's mingw64 gcc builds it instead.
      # This mirrors the documented local setup exactly.
      - name: MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Put mingw64 on PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "D:/a/_temp/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: Swatinem/rust-cache@v2

      - name: Cache the ggml build
        id: ggml-cache
        uses: actions/cache@v4
        with:
          path: ggml-libs
          key: ggml-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Build ggml (Windows, MinGW)
        if: runner.os == 'Windows' && steps.ggml-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF             -DLLAMA_BUILD_TESTS=OFF             -DLLAMA_BUILD_EXAMPLES=OFF             -DLLAMA_BUILD_SERVER=OFF             -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          ls -la ggml-libs
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a"               || { echo "::error::ggml-libs/$lib.a missing after building ggml"; exit 1; }
          done

      # GGML_METAL / GGML_BLAS are OFF on purpose, and not as a size saving.
      # ggml's cmake enables both by default on Apple, and `ggml.a` contains
      # `ggml-backend-reg.cpp`, which names the registration symbol of every
      # ENABLED backend. Building only the three CPU archives while leaving
      # them on links fine right up until something touches the device
      # registry -- then macOS fails with
      #   Undefined symbols: _ggml_backend_metal_reg, _ggml_backend_blas_reg
      # which reads as a missing library rather than as a build that promised
      # backends it did not produce. Enable a backend here only alongside
      # building and staging its archive.
      - name: Build ggml (Unix)
        if: runner.os != 'Windows' && steps.ggml-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF
          cmake --build llama.cpp/build --config Release --target ggml ggml-base ggml-cpu -j
          mkdir -p ggml-libs
          # Archive names and locations differ between generators, so collect
          # whatever landed and normalise the names build.rs expects.
          find llama.cpp/build \( -name 'libggml*.a' -o -name 'ggml*.a' \) -print | while read -r f; do
            cp "$f" "ggml-libs/$(basename "$f" | sed 's/^lib//')"
          done
          ls -la ggml-libs
          # Fail here rather than three steps later inside cargo: an empty
          # directory means ggml built shared libraries, which is llama.cpp's
          # default and the reason BUILD_SHARED_LIBS=OFF is set above.
          for lib in ggml-base ggml-cpu ggml; do
            test -f "ggml-libs/$lib.a" \
              || { echo "::error::ggml-libs/$lib.a missing after building ggml"; exit 1; }
          done

      - name: Build, lint and test
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: |
          cargo build --release --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --release --workspace

      # The container-backed tests skip themselves when no model is on disk.
      # This proves the skip path works, not that the tests pass.
      - name: Container tests skip cleanly without a model
        shell: bash
        env:
          GGML_LIB_DIR: ${{ github.workspace }}/ggml-libs
        run: cargo test --release --workspace -- --ignored
